# Frontend only.
#
# This file used to define a `backend` service as well, built from
# ../cem-master-backend. That was removed: the backend and the database are
# owned by cem-master-backend/compose.yaml + compose.local.yaml, and defining
# the same service in two places caused real problems --
#
#   * both files published port 8001, so running both failed, or worse, left you
#     talking to a backend you did not think you were talking to;
#   * the two definitions could drift (command, env, mounts) and behaviour then
#     depended on which file you happened to start from;
#   * the backend defined here had NO database -- there is no db service in this
#     file -- so it failed its healthcheck and the frontend, gated on
#     `service_healthy`, never started at all;
#   * `context: ../cem-master-backend` assumed a sibling checkout on the right
#     branch, which is fragile and made this repo responsible for knowing how to
#     build the other one.
#
# The frontend now just joins the shared network. nginx resolves the hostname
# `backend` via Docker DNS to whichever container provides that service, so
# nothing in nginx.conf changes.
#
# START ORDER
#   1. cd ../cem-master-backend && ./scripts/dev-up.sh     # database + backend
#   2. cd ../cem-master-frontend && docker compose up      # this file
#
# If the backend is not running, the page still loads and API calls return 502.
# That is deliberate: the frontend is no longer blocked on the backend's health,
# and a visible API error is easier to diagnose than a container that silently
# refuses to start.

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-8000}:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./styles:/usr/share/nginx/html/styles:ro
      - ./leaflet:/usr/share/nginx/html/leaflet:ro
    networks:
      - cem-network
    restart: unless-stopped

networks:
  # Created by cem-master-backend/scripts/dev-up.sh.
  # If it is missing: docker network create cem_master_network
  cem-network:
    external: true
    name: cem_master_network
