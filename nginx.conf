server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    # The browser only knows the frontend origin. Docker DNS resolves the
    # private service name "backend" inside the shared bridge network.
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location = /backend-health {
        proxy_pass http://backend:8001/health;
        proxy_set_header Host $host;
    }

    # Runtime API settings must be refreshed immediately after they change.
    location = /js/config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Do not expose hidden project files if the site is bind-mounted.
    location ~ /\. {
        deny all;
        return 404;
    }
}
